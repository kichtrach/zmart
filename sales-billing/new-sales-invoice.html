];
const steps=['Invoice Details','Customer Details','Add Items','Payment Details','Review & Submit'];let current=1;
function money(n){return '₹'+Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function stepsHTML(){return steps.map((s,i)=>`<div class="step ${i+1<current?'done':''} ${i+1===current?'active':''}" data-step="${i+1}"><span class="num">${i+1<current?'✓':i+1}</span><span>${s}</span></div>`).join('')}
function productRows(selected=true){return products.slice(0,selected?7:7).map((p,i)=>`<tr><td>${i+1}</td><td><div class="prod"><img src="${p.img}"><div><strong>${p.name}</strong></div></div></td><td>${p.sku}<br><small>${p.barcode}</small></td><td>${selected?p.unit:p.cat}</td>${selected?`<td>${money(p.price)}</td><td><div class="qty"><button data-q="-">−</button><input value="${p.qty}"><button data-q="+">+</button></div></td><td><input class="control" style="width:72px;height:32px" value="${i===2?10:0}"></td><td><select class="control" style="height:32px"><option>${p.tax}% (GST)</option><option>12% (GST)</option><option>18% (GST)</option></select></td><td><strong>${money(p.price*p.qty*1.05)}</strong></td><td><button class="btn danger" style="padding:0 10px;height:32px"><i class="fa-regular fa-trash-can"></i></button></td>`:`<td>${p.unit}</td><td class="stock">${p.stock}</td><td>${money(p.price)}</td><td><button class="btn outline add-product"><i class="fa-solid fa-plus"></i>Add</button></td>`}</tr>`).join('')}

function field(l,v,req=false){return `<div class="field"><label>${l}${req?' <span class="req">*</span>':''}</label><input class="control" value="${v}"></div>`}function dateField(l,v){const d=(v||'2025-05-31').split('-');const shown=`${d[2]}-${d[1]}-${d[0]}`;return `<div class="field custom-date"><label>${l} <span class="req">*</span></label><input class="control custom-date-input" value="${shown}" readonly><button type="button" class="date-trigger" aria-label="Open calendar"><i class="fa-regular fa-calendar"></i></button><div class="date-pop"><div class="cal-head"><button class="cal-nav" type="button">‹</button><span>May, 2025</span><button class="cal-nav" type="button">›</button></div><div class="cal-grid">${['Su','Mo','Tu','We','Th','Fr','Sa'].map(x=>`<b>${x}</b>`).join('')}${[27,28,29,30].map(x=>`<button type="button" class="cal-day" style="opacity:.45">${x}</button>`).join('')}${Array.from({length:31},(_,i)=>`<button type="button" class="cal-day ${i===30?'selected':''}" data-day="${i+1}">${i+1}</button>`).join('')}</div><div class="cal-foot"><button type="button" data-cal-clear>Clear</button><button type="button" data-day="31">Today</button></div></div></div>`}function selectField(l,a){return `<div class="field"><label>${l}</label><select class="control">${a.map(x=>`<option>${x}</option>`).join('')}</select></div>`}function switchRow(l,on){return `<div class="switch-row"><span class="switch ${on?'on':''}"></span><span>${l}</span></div>`}
function render(){document.getElementById('steps').innerHTML=stepsHTML();document.getElementById('content').innerHTML=current===1?step1():current===2?step2():current===3?step3():current===4?step4():current===5?step5():success();document.getElementById('prevBtn').style.display=current<=1||current===6?'none':'inline-flex';document.getElementById('nextBtn').style.display=current===6?'none':'inline-flex';document.getElementById('nextBtn').innerHTML=current===5?'<i class="fa-regular fa-file-lines"></i> Submit Invoice':'Next <i class="fa-solid fa-arrow-right"></i>';document.getElementById('crumbCurrent').textContent=current===6?'Invoice Created':'New Sales Invoice';document.querySelectorAll('.switch').forEach(s=>s.onclick=()=>s.classList.toggle('on'));document.querySelectorAll('.paymethod').forEach(b=>b.onclick=()=>{document.querySelectorAll('.paymethod').forEach(x=>x.classList.remove('active'));b.classList.add('active')});document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const inp=b.parentElement.querySelector('input');inp.value=Math.max(1,(+inp.value||1)+(b.dataset.q==='+'?1:-1))});document.querySelectorAll('.step').forEach(s=>s.onclick=()=>{if(current!==6){current=+s.dataset.step;render()}})}
document.getElementById('nextBtn').onclick=()=>{if(current<5)current++;else current=6;render();scrollTo({top:0,behavior:'smooth'})};document.getElementById('prevBtn').onclick=()=>{if(current>1)current--;render();scrollTo({top:0,behavior:'smooth'})};document.addEventListener('click',function(e){
 const wrap=e.target.closest('.custom-date');
 if(e.target.closest('.date-trigger')||e.target.classList.contains('custom-date-input')){e.preventDefault();const pop=wrap.querySelector('.date-pop');document.querySelectorAll('.date-pop.open').forEach(x=>{if(x!==pop)x.classList.remove('open')});pop.classList.toggle('open');return;}
 const day=e.target.closest('[data-day]');if(day&&wrap){e.preventDefault();const n=String(day.dataset.day).padStart(2,'0');wrap.querySelector('.custom-date-input').value=n+'-05-2025';wrap.querySelectorAll('.cal-day').forEach(x=>x.classList.remove('selected'));const target=wrap.querySelector('.cal-day[data-day="'+Number(n)+'"]');if(target)target.classList.add('selected');wrap.querySelector('.date-pop').classList.remove('open');return;}
 if(e.target.closest('[data-cal-clear]')&&wrap){e.preventDefault();wrap.querySelector('.custom-date-input').value='';wrap.querySelector('.date-pop').classList.remove('open');return;}
 if(!e.target.closest('.date-pop'))document.querySelectorAll('.date-pop.open').forEach(x=>x.classList.remove('open'));
});
