<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>ZMart | Edit Financial Year</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet"/>
<link href="../components/sidebar/css/sidebar.css" rel="stylesheet"/><link href="../components/sidebar/icons/sidebar-icons.css" rel="stylesheet"/>
<link href="../components/topbar/css/topbar.css" rel="stylesheet"/><link href="../components/topbar/icons/topbar-icons.css" rel="stylesheet"/>
<link href="../components/ui/icons/ui-icons.css" rel="stylesheet"/><link href="../components/ui/css/ui-components.css" rel="stylesheet"/>
<link href="../assets/css/company-management.css" rel="stylesheet"/>
<link href="../assets/css/calendar-theme.css" rel="stylesheet"/><link href="../assets/css/common-page-layout.css" rel="stylesheet"/><link href="../assets/css/mandatory-inline-fix.css" rel="stylesheet"/></head>
<body>
<aside aria-label="Main navigation" id="sidebarMount"></aside>
<div class="app-shell">
<header id="topbarMount"></header>
<main class="company-main" id="mainContent">
<div class="cm-toolbar">
<div class="breadcrumb"><span>Company Management</span><i class="fa-solid fa-chevron-right"></i><span>Financial Year &gt; Edit Financial Year</span></div>
<div class="cm-actions"><button class="ui-btn ui-btn-sm" data-href="financial-year.html"><i class="fa-solid fa-arrow-left"></i> Back to List</button><button class="ui-btn ui-btn-primary ui-btn-sm" data-action="save"><i class="fa-regular fa-floppy-disk"></i> Save Changes</button></div>
</div>
<div class="cm-tabs-wrap"><div class="ui-tabs"><button class="ui-tab" data-href="company-profile.html">Company Profile</button><button class="ui-tab active" data-href="financial-year.html">Financial Year</button><button class="ui-tab" data-href="business-settings.html">Business Settings</button><button class="ui-tab" data-href="gst-settings.html">GST Settings</button><button class="ui-tab" data-href="invoice-settings.html">Invoice Settings</button><button class="ui-tab" data-href="tax-configuration.html">Tax Configuration</button><button class="ui-tab" data-href="currency-settings.html">Currency Settings</button><button class="ui-tab" data-href="backup-settings.html">Backup Settings</button></div></div>
<section class="cm-page">
<div class="ui-card cm-section"><div class="ui-card-title"><i class="fa-regular fa-calendar-days"></i> Edit Financial Year</div><div class="cm-form-grid"><div class="ui-field"><label><span class="field-label-inline">Financial Year Code <span class="req">*</span></span></label><input class="ui-input" value="FY2025-26"/></div><div class="ui-field"><label><span class="field-label-inline">Financial Year Name <span class="req">*</span></span></label><input class="ui-input" value="Financial Year 2025 - 2026"/></div><div class="ui-field"><label><span class="field-label-inline">Status <span class="req">*</span></span></label><select class="ui-select"><option>Active</option><option>Inactive</option><option>Pending</option><option>Draft</option><option>Approved</option><option>Rejected</option><option>On Hold</option><option>Completed</option></select></div></div></div>
<div class="cm-grid cols-2">
<div class="ui-card"><div class="ui-card-title"><i class="fa-regular fa-calendar-days"></i> Period Information</div><div class="cm-form-grid cols-2"><div class="ui-field"><label><span class="field-label-inline">Start Date <span class="req">*</span></span></label><input class="ui-input" type="date" value="2025-04-01"/></div><div class="ui-field"><label><span class="field-label-inline">End Date <span class="req">*</span></span></label><input class="ui-input" type="date" value="2026-03-31"/></div><div class="ui-field"><label><span class="field-label-inline">No. of Months <span class="req">*</span></span></label><input class="ui-input" value="12"/></div><div class="ui-field"><label>Duration</label><input class="ui-input" readonly="" value="12 Months"/></div><div class="ui-field"><label><span class="field-label-inline">First Month <span class="req">*</span></span></label><select class="ui-select"><option>April</option></select></div><div class="ui-field"><label><span class="field-label-inline">Last Month <span class="req">*</span></span></label><select class="ui-select"><option>March</option></select></div><div class="ui-field"><label>Current Month</label><select class="ui-select"><option>May 2025</option></select></div><div class="ui-field"><label>Current Period</label><input class="ui-input" readonly="" value="2 / 12"/></div></div></div>
<div class="ui-card"><div class="ui-card-title"><i class="fa-regular fa-building"></i> Accounting Information</div><div class="cm-form-grid cols-2"><div class="ui-field"><label><span class="field-label-inline">Opening Balance Date <span class="req">*</span></span></label><input class="ui-input" type="date" value="2025-04-01"/></div><div class="ui-field"><label><span class="field-label-inline">Opening Stock Date <span class="req">*</span></span></label><input class="ui-input" type="date" value="2025-04-01"/></div><div class="ui-field"><label><span class="field-label-inline">Profit &amp; Loss Account <span class="req">*</span></span></label><select class="ui-select"><option>P&amp;L - 2025-26</option></select></div><div class="ui-field"><label><span class="field-label-inline">Default Tax Setup <span class="req">*</span></span></label><select class="ui-select"><option>GSTIN - 33AAACZ1234A1Z5</option></select></div><div class="ui-field"><label><span class="field-label-inline">Default Currency <span class="req">*</span></span></label><select class="ui-select"><option>INR - Indian Rupee</option></select></div><div class="ui-field"><label>Rounding Off</label><select class="ui-select"><option>Two Decimal Places (0.01)</option></select></div></div></div>
</div>
<div class="cm-grid cols-2" style="margin-top:12px"><div class="ui-card"><div class="ui-card-title"><i class="fa-solid fa-stamp"></i> Tax Information</div><div class="cm-form-grid"><div class="ui-field"><label><span class="field-label-inline">GST Number <span class="req">*</span></span></label><input class="ui-input" value="33AAACZ1234A1Z5"/></div><div class="ui-field"><label><span class="field-label-inline">PAN Number <span class="req">*</span></span></label><input class="ui-input" value="AAACZ1234A"/></div><div class="ui-field"><label>TAN Number</label><input class="ui-input" value="CHNZ12345D"/></div></div></div><div class="ui-card"><div class="ui-card-title"><i class="fa-regular fa-note-sticky"></i> Notes</div><div class="cm-form-grid cols-2"><div class="ui-field"><label>Description</label><textarea class="ui-textarea">Financial Year for accounting and reporting period from 01 April 2025 to 31 March 2026.</textarea></div><div class="ui-field"><label>Remarks</label><textarea class="ui-textarea" placeholder="Enter remarks (optional)"></textarea></div></div></div></div>
<div class="cm-bottom-actions"><button class="ui-btn" data-action="reset"><i class="fa-solid fa-rotate"></i> Reset</button><button class="ui-btn ui-btn-primary" data-action="save"><i class="fa-regular fa-floppy-disk"></i> Save Changes</button></div>
</section>
</main>
</div>
<div class="toast" id="toast"></div>
