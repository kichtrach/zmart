<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZMart | Edit Branch</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="../components/sidebar/css/sidebar.css"><link rel="stylesheet" href="../components/sidebar/icons/sidebar-icons.css">
<link rel="stylesheet" href="../components/topbar/css/topbar.css"><link rel="stylesheet" href="../components/topbar/icons/topbar-icons.css">
<link rel="stylesheet" href="../components/ui/css/ui-components.css"><link rel="stylesheet" href="../components/ui/icons/ui-icons.css">
<link rel="stylesheet" href="../assets/css/branch-management.css"></head><body>
<aside id="sidebarMount"></aside><div class="app-shell"><header id="topbarMount"></header><main class="branch-main" id="mainContent">
<div class="branch-head"><div class="breadcrumb"><span>Home</span><i class="fa-solid fa-chevron-right"></i><span>Branch Management</span><i class="fa-solid fa-chevron-right"></i><span>Branch Master</span><i class="fa-solid fa-chevron-right"></i><span>Edit Branch (ZM001)</span></div></div>
<div class="branch-head" style="margin-top:-8px"><div></div><div class="page-actions"><button class="btn" data-href="branch-master.html">Cancel</button><button class="btn btn-primary" data-action="save-branch">Update Branch</button></div></div>
<div class="form-section"><div class="form-section-title">1. Branch Information</div><div class="form-grid">
<div class="field"><label>Branch Code <span class="req">*</span></label><div class="input-icon"><i class="fa-regular fa-building"></i><input class="input" value="ZM001" placeholder="Enter Branch Code"></div></div>
<div class="field"><label>Branch Name <span class="req">*</span></label><div class="input-icon"><i class="fa-regular fa-building"></i><input class="input" value="ZMart Head Office" placeholder="Enter Branch Name"></div></div>
<div class="field"><label>Branch Type <span class="req">*</span></label><div class="input-icon"><i class="fa-solid fa-code-branch"></i><select class="select"><option>Head Office</option><option>Head Office</option><option>Retail Branch</option></select></div></div>
<div class="field"><label>Parent Branch</label><div class="input-icon"><i class="fa-solid fa-people-arrows-left-right"></i><select class="select"><option>Select Parent Branch (if any)</option></select></div></div>
<div class="field"><label>Email</label><div class="input-icon"><i class="fa-regular fa-envelope"></i><input class="input" value="headoffice@zmartsupermarket.com" placeholder="Enter Email Address"></div></div>
<div class="field"><label>Phone Number <span class="req">*</span></label><div class="input-icon"><i class="fa-solid fa-phone"></i><input class="input" value="+91 44 1234 5678" placeholder="Enter Phone Number"></div></div>
<div class="field"><label>Alternate Phone</label><div class="input-icon"><i class="fa-solid fa-phone"></i><input class="input" value="+91 98 7654 3210" placeholder="Enter Alternate Phone"></div></div>
<div class="field"><label>GST Number</label><div class="input-icon"><i class="fa-regular fa-id-card"></i><input class="input" value="33AAACZ1234A1Z5" placeholder="Enter GST Number"></div></div>
<div class="field"><label>PAN Number</label><div class="input-icon"><i class="fa-regular fa-id-card"></i><input class="input" value="AAACZ1234A" placeholder="Enter PAN Number"></div></div>
<div class="field"><label>Opening Date <span class="req">*</span></label><input type="date" class="input ui-input" value="2018-01-01"></div>
<div class="field"><label>Status <span class="req">*</span></label><select class="select"><option>Active</option><option>Active</option><option>Inactive</option></select></div>
<div class="field"><label>Branch Manager</label><select class="select"><option>Ramesh Kumar</option></select></div>
</div></div>
<div class="form-section"><div class="form-section-title">2. Branch Address</div><div class="form-grid">
<div class="field" style="grid-column:span 2"><label>Address Line 1 <span class="req">*</span></label><div class="input-icon"><i class="fa-solid fa-location-dot"></i><input class="input" value="No. 45, Market Street, Anna Salai" placeholder="Enter Address Line 1"></div></div>
<div class="field"><label>Address Line 2</label><div class="input-icon"><i class="fa-solid fa-location-dot"></i><input class="input" value="Near City Center Mall" placeholder="Enter Address Line 2"></div></div>
<div class="field"><label>Country <span class="req">*</span></label><select class="select"><option>India</option></select></div>
<div class="field"><label>State <span class="req">*</span></label><select class="select"><option>Tamil Nadu</option></select></div>
<div class="field"><label>City <span class="req">*</span></label><select class="select"><option>Chennai</option></select></div>
<div class="field"><label>Pincode <span class="req">*</span></label><input class="input" value="600002" placeholder="Enter Pincode"></div>
</div></div>
<div class="form-section"><div class="form-section-title">3. Additional Information</div><div class="form-grid">
<div class="field"><label>Currency <span class="req">*</span></label><select class="select"><option>INR - Indian Rupee</option></select></div>
<div class="field"><label>Timezone <span class="req">*</span></label><select class="select"><option>(UTC+05:30) Asia/Kolkata</option></select></div>
<div class="field"><label>Default Warehouse</label><select class="select"><option>Select Warehouse</option></select></div>
<div class="field" style="grid-column:span 2"><label>Working Days</label><div class="checks"><label class="check"><input type="checkbox" checked> Mon</label><label class="check"><input type="checkbox" checked> Tue</label><label class="check"><input type="checkbox" checked> Wed</label><label class="check"><input type="checkbox" checked> Thu</label><label class="check"><input type="checkbox" checked> Fri</label><label class="check"><input type="checkbox" checked> Sat</label><label class="check"><input type="checkbox" > Sun</label></div></div>
<div class="field"><label>Notes</label><textarea class="textarea" placeholder="Enter any additional notes...">This is the main head office branch.</textarea></div>
</div></div>
<div class="page-actions" style="justify-content:center"><button class="btn" data-href="branch-master.html">Cancel</button><button class="btn btn-primary" data-action="save-branch">Update Branch</button></div>
</main></div>
<div id="branchToast" class="toast"></div>
<script src="../components/sidebar/js/sidebar.js"></script><script src="../components/topbar/js/topbar.js"></script><script src="../components/ui/js/ui-components.js"></script><script src="../assets/js/branch-management.js"></script>
</body></html>
