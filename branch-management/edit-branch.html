<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>ZMart | Edit Branch</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet"/>
<link href="../components/sidebar/css/sidebar.css" rel="stylesheet"/><link href="../components/sidebar/icons/sidebar-icons.css" rel="stylesheet"/>
<link href="../components/topbar/css/topbar.css" rel="stylesheet"/><link href="../components/topbar/icons/topbar-icons.css" rel="stylesheet"/>
<link href="../components/ui/css/ui-components.css" rel="stylesheet"/><link href="../components/ui/icons/ui-icons.css" rel="stylesheet"/>
<link href="../assets/css/branch-management.css" rel="stylesheet"/><link href="../assets/css/calendar-theme.css" rel="stylesheet"/><link href="../assets/css/common-page-layout.css" rel="stylesheet"/><link href="../assets/css/mandatory-inline-fix.css" rel="stylesheet"/><link href="../assets/css/zmart-global-generic-theme.css" rel="stylesheet"/></head><body>
<aside id="sidebarMount"></aside><div class="app-shell"><header id="topbarMount"></header><main class="branch-main" id="mainContent">
<div class="branch-head"><div class="breadcrumb"><span>Home</span><i class="fa-solid fa-chevron-right"></i><span>Branch Management</span><i class="fa-solid fa-chevron-right"></i><span>Branch Master</span><i class="fa-solid fa-chevron-right"></i><span>Edit Branch (ZM001)</span></div></div>
<div class="branch-head" style="margin-top:-8px"><div></div><div class="page-actions"><button class="btn" data-href="branch-master.html">Cancel</button><button class="btn btn-primary" data-action="save-branch">Update Branch</button></div></div>
<div class="form-section"><div class="form-section-title">1. Branch Information</div><div class="form-grid">
<div class="field"><label><span class="field-label-inline">Branch Code <span class="req">*</span></span></label><div class="input-icon"><i class="fa-regular fa-building"></i><input class="input" placeholder="Enter Branch Code" value="ZM001"/></div></div>
<div class="field"><label><span class="field-label-inline">Branch Name <span class="req">*</span></span></label><div class="input-icon"><i class="fa-regular fa-building"></i><input class="input" placeholder="Enter Branch Name" value="ZMart Head Office"/></div></div>
<div class="field"><label><span class="field-label-inline">Branch Type <span class="req">*</span></span></label><div class="input-icon"><i class="fa-solid fa-code-branch"></i><select class="select"><option>Head Office</option><option>Head Office</option><option>Retail Branch</option><option>ZMart Anna Nagar</option><option>ZMart T. Nagar</option><option>ZMart Velachery</option><option>ZMart Adyar</option><option>ZMart Tambaram</option><option>ZMart Porur</option><option>ZMart Ambattur</option><option>ZMart Chrompet</option><option>ZMart Guindy</option><option>ZMart OMR</option></select></div></div>
<div class="field"><label>Parent Branch</label><div class="input-icon"><i class="fa-solid fa-people-arrows-left-right"></i><select class="select"><option>Select Parent Branch (if any)</option><option>ZMart Anna Nagar</option><option>ZMart T. Nagar</option><option>ZMart Velachery</option><option>ZMart Adyar</option><option>ZMart Tambaram</option><option>ZMart Porur</option><option>ZMart Ambattur</option><option>ZMart Chrompet</option><option>ZMart Guindy</option><option>ZMart OMR</option></select></div></div>
<div class="field"><label>Email</label><div class="input-icon"><i class="fa-regular fa-envelope"></i><input class="input" placeholder="Enter Email Address" value="headoffice@zmartsupermarket.com"/></div></div>
<div class="field"><label><span class="field-label-inline">Phone Number <span class="req">*</span></span></label><div class="input-icon"><i class="fa-solid fa-phone"></i><input class="input" placeholder="Enter Phone Number" value="+91 44 1234 5678"/></div></div>
<div class="field"><label>Alternate Phone</label><div class="input-icon"><i class="fa-solid fa-phone"></i><input class="input" placeholder="Enter Alternate Phone" value="+91 98 7654 3210"/></div></div>
<div class="field"><label>GST Number</label><div class="input-icon"><i class="fa-regular fa-id-card"></i><input class="input" placeholder="Enter GST Number" value="33AAACZ1234A1Z5"/></div></div>
<div class="field"><label>PAN Number</label><div class="input-icon"><i class="fa-regular fa-id-card"></i><input class="input" placeholder="Enter PAN Number" value="AAACZ1234A"/></div></div>
<div class="field"><label><span class="field-label-inline">Opening Date <span class="req">*</span></span></label><input class="input ui-input" type="date" value="2018-01-01"/></div>
<div class="field"><label><span class="field-label-inline">Status <span class="req">*</span></span></label><select class="select"><option>Active</option><option>Active</option><option>Inactive</option><option>Pending</option><option>Draft</option><option>Approved</option><option>Rejected</option><option>On Hold</option><option>Completed</option></select></div>
<div class="field"><label>Branch Manager</label><select class="select"><option>Ramesh Kumar</option><option>ZMart Anna Nagar</option><option>ZMart T. Nagar</option><option>ZMart Velachery</option><option>ZMart Adyar</option><option>ZMart Tambaram</option><option>ZMart Porur</option><option>ZMart Ambattur</option><option>ZMart Chrompet</option><option>ZMart Guindy</option><option>ZMart OMR</option></select></div>
</div></div>
<div class="form-section"><div class="form-section-title">2. Branch Address</div><div class="form-grid">
<div class="field" style="grid-column:span 2"><label><span class="field-label-inline">Address Line 1 <span class="req">*</span></span></label><div class="input-icon"><i class="fa-solid fa-location-dot"></i><input class="input" placeholder="Enter Address Line 1" value="No. 45, Market Street, Anna Salai"/></div></div>
<div class="field"><label>Address Line 2</label><div class="input-icon"><i class="fa-solid fa-location-dot"></i><input class="input" placeholder="Enter Address Line 2" value="Near City Center Mall"/></div></div>
<div class="field"><label><span class="field-label-inline">Country <span class="req">*</span></span></label><select class="select"><option>India</option></select></div>
<div class="field"><label><span class="field-label-inline">State <span class="req">*</span></span></label><select class="select"><option>Tamil Nadu</option></select></div>
<div class="field"><label><span class="field-label-inline">City <span class="req">*</span></span></label><select class="select"><option>Chennai</option></select></div>
<div class="field"><label><span class="field-label-inline">Pincode <span class="req">*</span></span></label><input class="input" placeholder="Enter Pincode" value="600002"/></div>
</div></div>
<div class="form-section"><div class="form-section-title">3. Additional Information</div><div class="form-grid">
<div class="field"><label><span class="field-label-inline">Currency <span class="req">*</span></span></label><select class="select"><option>INR - Indian Rupee</option></select></div>
<div class="field"><label><span class="field-label-inline">Timezone <span class="req">*</span></span></label><select class="select"><option>(UTC+05:30) Asia/Kolkata</option></select></div>
<div class="field"><label>Default Warehouse</label><select class="select"><option>Select Warehouse</option><option>Central Warehouse - Chennai</option><option>North Chennai Warehouse</option><option>South Chennai Warehouse</option><option>OMR Distribution Center</option><option>Tambaram Warehouse</option><option>Ambattur Warehouse</option></select></div>
<div class="field" style="grid-column:span 2"><label>Working Days</label><div class="checks"><label class="check"><input checked="" type="checkbox"/> Mon</label><label class="check"><input checked="" type="checkbox"/> Tue</label><label class="check"><input checked="" type="checkbox"/> Wed</label><label class="check"><input checked="" type="checkbox"/> Thu</label><label class="check"><input checked="" type="checkbox"/> Fri</label><label class="check"><input checked="" type="checkbox"/> Sat</label><label class="check"><input type="checkbox"/> Sun</label></div></div>
<div class="field"><label>Notes</label><textarea class="textarea" placeholder="Enter any additional notes...">This is the main head office branch.</textarea></div>
</div></div>
<div class="page-actions" style="justify-content:center"><button class="btn" data-href="branch-master.html">Cancel</button><button class="btn btn-primary" data-action="save-branch">Update Branch</button></div>
</main></div>
<div class="toast" id="branchToast"></div>
<script src="../components/sidebar/js/sidebar.js"></script><script src="../components/topbar/js/topbar.js"></script><script src="../components/ui/js/ui-components.js"></script><script src="../assets/js/branch-management.js"></script>
<script src="../assets/js/calendar-theme.js"></script><script src="../assets/js/common-breadcrumb.js"></script><script src="../assets/js/zmart-global-actions.js"></script>
<script src="../assets/js/zmart-global-actions-v2.js"></script>
</body></html>
